<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TukPool - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: white; border-radius: 16px; width: 100%; max-width: 400px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h2 class="fw-bold text-dark mb-1">🛺 TukPool</h2>
    <p class="text-muted small mb-4">ADMIN PORTAL LOGIN</p>

    <div id="errorMsg" class="alert alert-danger d-none py-2 small"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3 text-start">
            <label class="form-label text-secondary small fw-bold">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter admin username" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label text-secondary small fw-bold">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Sign In</button>
    </form>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");

        errorMsg.classList.add("d-none");

        try {
            const response = await fetch("http://localhost:8081/api/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                // Store admin login status in LocalStorage
                localStorage.setItem("adminLoggedIn", "true");
                window.location.href = "admin.html";
            } else {
                const errorText = await response.text();
                errorMsg.innerText = errorText || "Invalid Credentials!";
                errorMsg.classList.remove("d-none");
            }
        } catch (err) {
            errorMsg.innerText = "Error connecting to backend server!";
            errorMsg.classList.remove("d-none");
        }
    }
</script>
</body>
</html>
