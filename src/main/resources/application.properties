spring.application.name=backend

# MySQL Database Configuration (Set Timezone to Sri Lanka)
spring.datasource.url=jdbc:mysql://localhost:3306/campuspool_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# Server Configuration
server.port=8081